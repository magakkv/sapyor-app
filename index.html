<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Сапёр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>💣 Сапёр</h1>
<div class="levels" id="levels"></div>
<div class="stats">
<div class="stat" id="mines">💣 0</div>
<button class="btn" id="mode">⛏</button>
<button class="btn" id="restart">🔄</button>
<div class="stat" id="time">⏱ 0</div>
</div>
<div class="board-wrap"><div class="board" id="board"></div></div>
<div class="result" id="result">
<div class="title" id="rtitle"></div>
<div class="sub" id="rsub"></div>
<button class="primary" id="again">Играть снова</button>
</div>
<div class="hint">Тап — открыть клетку. Долгое нажатие — флажок. Тап по цифре открывает соседние клетки, если рядом хватает флажков.</div>
<script src="game1.js"></script>
<script src="game2.js"></script>
<script src="game3.js"></script>
</body>
</html>
